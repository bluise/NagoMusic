name: build-release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: flutter build apk --debug --split-per-abi

      # 上传产物到当前Actions任务的Artifacts（直接在这里下载，不用Release）
      - name: Upload debug apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nagomusic-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
