name: build-release
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: flutter build apk --debug --split-per-abi
      - run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${FULL_VERSION%%+*}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - run: |
          git log -1 --pretty=format:"- %s%n%b" > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- ${GITHUB_SHA}" > release_notes.txt
          fi
      - run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk nagomusic-v${VERSION}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk nagomusic-v${VERSION}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-debug.apk nagomusic-v${VERSION}-x86_64.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release_notes.txt
          files: |
            nagomusic-v${{ env.VERSION }}-arm64-v8a.apk
            nagomusic-v${{ env.VERSION }}-armeabi-v7a.apk
            nagomusic-v${{ env.VERSION }}-x86_64.apk
